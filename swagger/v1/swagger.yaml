---
openapi: 3.0.1
info:
  title: Shuttle Office Service API
  version: v1
  description: API for managing office shuttle bus bookings
paths:
  "/api/v1/login":
    post:
      summary: Login
      tags:
      - Authentication
      parameters: []
      responses:
        '202':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                      token:
                        type: string
                  message:
                    type: string
                required:
                - success
                - data
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  errors:
                    type: object
                    properties:
                      base:
                        type: array
                        items:
                          type: string
                required:
                - success
                - errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: admin@test.com
                    password:
                      type: string
                      example: password123
                  required:
                  - email
                  - password
